<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>KimiAccess Einstellungen</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 12px 16px; width: 320px; color: #111; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    h2 { font-size: 14px; margin: 16px 0 4px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; margin: 8px 0; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; padding: 2px 0; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
    dt { font-weight: 600; white-space: nowrap; }
    dd { margin: 0; }
    #status { min-height: 1.5em; color: #064; }
    :focus-visible { outline: 2px solid #1a5fd0; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #1e1e1e; }
      fieldset { border-color: #555; }
      #status { color: #7d7; }
    }
  </style>
</head>
<body>
  <h1>KimiAccess</h1>
  <fieldset>
    <legend>Antworten von Kimi vorlesen</legend>
    <label><input type="radio" name="speak" value="end"> Wenn die Antwort fertig ist</label>
    <label><input type="radio" name="speak" value="stream"> Satzweise schon beim Schreiben</label>
    <label><input type="radio" name="speak" value="off"> Nicht vorlesen, nur „Antwort fertig“ melden</label>
  </fieldset>
  <label><input type="checkbox" id="headings"> Überschrift vor jeder Nachricht („Du“ / „Kimi“)</label>
  <p id="status" role="status"></p>

  <h2>Tastenkürzel (Alt + Umschalt, Mac: Option + Umschalt)</h2>
  <dl>
    <dt>I</dt><dd>Zum Eingabefeld</dd>
    <dt>L</dt><dd>Letzte Antwort vorlesen</dd>
    <dt>M</dt><dd>Zur letzten Antwort springen</dd>
    <dt>S</dt><dd>Antwort stoppen</dd>
    <dt>X</dt><dd>Dialog oder Seitenbereich schließen</dd>
    <dt>H</dt><dd>Tastenkürzel ansagen</dd>
  </dl>
  <script src="popup.js"></script>
</body>
</html>
