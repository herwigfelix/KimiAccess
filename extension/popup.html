<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="actionTitle">KimiAccess settings</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 12px 16px; width: 320px; color: #111; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    h2 { font-size: 14px; margin: 16px 0 4px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; margin: 8px 0; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; padding: 2px 0; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
    dt { font-weight: 600; white-space: nowrap; }
    dd { margin: 0; }
    #status { min-height: 1.5em; color: #064; }
    :focus-visible { outline: 2px solid #1a5fd0; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #1e1e1e; }
      fieldset { border-color: #555; }
      #status { color: #7d7; }
    }
  </style>
</head>
<body>
  <h1>KimiAccess</h1>
  <fieldset>
    <legend data-i18n="speakLegend"></legend>
    <label><input type="radio" name="speak" value="end"> <span data-i18n="speakEnd"></span></label>
    <label><input type="radio" name="speak" value="stream"> <span data-i18n="speakStream"></span></label>
    <label><input type="radio" name="speak" value="off"> <span data-i18n="speakOff"></span></label>
  </fieldset>
  <label><input type="checkbox" id="headings"> <span data-i18n="headings"></span></label>
  <p id="status" role="status"></p>

  <h2 data-i18n="shortcutsTitle"></h2>
  <dl>
    <dt>I</dt><dd data-i18n="keyI"></dd>
    <dt>L</dt><dd data-i18n="keyL"></dd>
    <dt>M</dt><dd data-i18n="keyM"></dd>
    <dt>S</dt><dd data-i18n="keyS"></dd>
    <dt>X</dt><dd data-i18n="keyX"></dd>
    <dt>H</dt><dd data-i18n="keyH"></dd>
  </dl>
  <script src="popup.js"></script>
</body>
</html>
